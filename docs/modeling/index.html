/** 명세 9.4 검증 규칙. */
function validateRecipe(r) {
  const errors = [], warnings = [];
  if (!r || typeof r !== 'object') return { errors: ['recipe 객체가 없습니다'], warnings };
  if (r.schema_version !== '1.0') warnings.push(`알 수 없는 schema_version: ${r.schema_version}`);
  if (!['ok', 'infeasible', 'out_of_domain'].includes(r.status)) errors.push(`status 값 오류: ${r.status}`);
  if (r.status === 'ok' && (!r.recipe || !r.prediction)) errors.push('status=ok 인데 recipe 또는 prediction 이 없습니다');
  if (r.recipe) {
    for (const k of Object.keys(BOUNDS)) {
      const v = r.recipe[k];
      if (!isNum(v)) errors.push(`recipe.${k} 가 숫자가 아닙니다`);
      else if (v < BOUNDS[k][0] || v > BOUNDS[k][1]) warnings.push(`recipe.${k}=${v} 범위 밖 — 애니메이션 입력만 자름`);
    }
  }
  if (r.prediction) {
    for (const m of ['ni', 'co']) for (const s of ['mean', 'low', 'high']) {
      if (!isNum(r.prediction?.[m]?.[s])) errors.push(`prediction.${m}.${s} 가 숫자가 아닙니다`);
    }
  }
  return { errors, warnings };
}

/** 화면이 읽는 유일한 객체 (명세 9.3). Module 3 키는 여기서만 읽는다. */
function toViewModel(sc, warnings = []) {
  const r = sc.recipe, f = sc.feed;
  const g = f && String(f.grade ?? '').trim().toUpperCase().replace('급', '');
  const grade = ['A', 'B', 'C'].includes(g) ? g : null;
  const impurityTotal = f && [f.cu_pct, f.fe_pct, f.al_pct].every(isNum) ? f.cu_pct + f.fe_pct + f.al_pct : null;
  let recoveredKg = null;
  if (f && r.prediction && isNum(f.feed_kg)) {
    const ni = f.feed_kg * f.ni_pct / 100 * r.prediction.ni.mean / 100;
    const co = f.feed_kg * f.co_pct / 100 * r.prediction.co.mean / 100;
    recoveredKg = { ni, co, niSulfate: ni * MOLAR.NiSO4_6H2O / MOLAR.Ni, coSulfate: co * MOLAR.CoSO4_7H2O / MOLAR.Co };
  }
  const version = String(r.meta?.model_version ?? '');
  return {
    status: r.status,
    batchId: r.batch_id ?? f?.batch_id ?? null,
    grade, feed: f, impurityTotal,
    target: { ni: r.target?.ni_recovery_pct ?? 95, co: r.target?.co_recovery_pct ?? 90 },
    recipe: r.recipe, prediction: r.prediction, recoveredKg,
    evidence: sc.evidence,
    confidence: r.status === 'ok' ? (r.confidence ?? null) : null,
    similarBatches: r.similar_batches ?? null,
    message: r.message ?? '',
    isDevModel: /^(mock|proxy|demo)/.test(version),
    modelVersion: version,
    warnings, scenarioName: sc.name,
  };
}

function mapRecipe(vm, override = null) {
  const src = override || vm.recipe;
  if (!src) return null;
  const acid = clampTo(src.acid_l, BOUNDS.acid_l);
  const temp = clampTo(src.temp_c, BOUNDS.temp_c);
  const time = clampTo(src.time_hr, BOUNDS.time_hr);

function roundedPath(pts, radius = 0.25) {

    const d1 = b.clone().sub(a); const l1 = d1.length(); d1.normalize();
    const d2 = c.clone().sub(b); const l2 = d2.length(); d2.normalize();
    const r = Math.min(radius, l1 / 2, l2 / 2);
    const p1 = b.clone().addScaledVector(d1, -r), p2 = b.clone().addScaledVector(d2, r);
    if (prev.distanceTo(p1) > 1e-4) path.add(new THREE.LineCurve3(prev, p1));
    path.add(new THREE.QuadraticBezierCurve3(p1, b.clone(), p2));
    prev = p2;
  }
  path.add(new THREE.LineCurve3(prev, pts[pts.length - 1].clone()));
  return path;
}

  const [sx, sz] = PILE_SLOTS[index % 4];
  return new THREE.Vector3(px + sx, Math.floor(index / 4) * 0.92, pz + sz);
}

function buildRawMaterialZone(scene, vm) {
  const piles = {}, labels = {};
  for (const G of ['A', 'B', 'C']) {
    const pile = new THREE.Group(); pile.name = 'orePile' + G;
    for (let i = 0; i < PILE_COUNT[G]; i++) {
      const bag = makeTonbag(G);
      bag.position.copy(slotPosition(G, i)).sub(new THREE.Vector3(PILE_POS[G][0], 0, PILE_POS[G][1]));
      bag.rotation.y = (rng() - 0.5) * 0.12;
      pile.add(bag);
    }
    pile.position.set(PILE_POS[G][0], 0, PILE_POS[G][1]);
    const share = (GRADE_COUNT[G] / GRADE_TOTAL * 100).toFixed(1);
    const lbl = makeLabel(`<b>${G}급 원료</b> · ${share}%<br><span class="sub">블랙파우더 톤백</span>`, `grade-${G}` + (vm.grade === G ? ' current' : ''));
    lbl.position.set(0, 2.3, 0); pile.add(lbl);
    scene.add(pile); registerEquip(pile, 'orePile' + G);
    piles[G] = pile; labels[G] = lbl;
  }

  // 폐배터리 팩 팔레트 (블랙파우더의 출처, 장식)
  const pallet = new THREE.Group(); pallet.name = 'batteryPallet';
  place(pallet, mesh(boxGeo(1.6, 0.14, 1.2), M.wood, { cast: true }), 0, 0.07, 0);
  const modGeo = boxGeo(0.62, 0.2, 0.34), modMat = new THREE.MeshStandardMaterial({ color: 0x3a4250, roughness: 0.5, metalness: 0.4 });
  const termMat = new THREE.MeshStandardMaterial({ color: 0xe8590c, roughness: 0.4 });
  for (let layer = 0; layer < 2; layer++) for (let i = 0; i < 2; i++) for (let j = 0; j < 3; j++) {
    const m = place(pallet, mesh(modGeo, modMat, { cast: true }), -0.36 + i * 0.72, 0.24 + layer * 0.21, -0.38 + j * 0.38);
    place(pallet, mesh(boxGeo(0.06, 0.03, 0.06), termMat), m.position.x + 0.22, m.position.y + 0.11, m.position.z);
  }
  const plbl = makeLabel('<b>폐배터리 팩</b><br><span class="sub">전처리(방전 · 파쇄) 전</span>');
  plbl.position.set(0, 1.1, 0); pallet.add(plbl);
  pallet.position.set(-10.5, 0, 6.5); scene.add(pallet); registerEquip(pallet, 'batteryPallet');

  // 제어반 (SCADA 화면)
  const panel = new THREE.Group(); panel.name = 'controlPanel';
  place(panel, mesh(boxGeo(1.6, 2.0, 0.5), new THREE.MeshStandardMaterial({ color: 0xc5ccd3, roughness: 0.5, metalness: 0.3 }), { cast: true }), 0, 1.0, 0);
  const screen = canvasTexture(512, 256, () => {});
  M.screen = new THREE.MeshBasicMaterial({ map: screen.tex });
  place(panel, new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.65), M.screen), 0, 1.45, 0.252);
  for (let i = 0; i < 4; i++) {
    const lamp = mesh(cylGeo(0.035, 0.035, 0.03, 12), new THREE.MeshStandardMaterial({ color: 0x222, emissive: [0x40c057, 0x40c057, 0xfcc419, 0x4dabf7][i], emissiveIntensity: 1.4 }));
    lamp.rotation.x = Math.PI / 2; place(panel, lamp, -0.45 + i * 0.3, 0.9, 0.26);
  }
  const clbl = makeLabel('<b>제어반</b>'); clbl.position.set(0, 2.35, 0); panel.add(clbl);
  panel.position.set(-9, 0, -7.6); scene.add(panel); registerEquip(panel, 'controlPanel');

  return { piles, labels, screen };
}

function drawScada(screen, st) {
  const c = screen.ctx, W = screen.canvas.width, H = screen.canvas.height;
  c.fillStyle = '#071018'; c.fillRect(0, 0, W, H);
  c.fillStyle = '#4dabf7'; c.font = 'bold 26px sans-serif'; c.fillText('LEACHING LINE 1', 18, 38);
  c.fillStyle = '#69db7c'; c.font = '22px monospace';
  const lines = [
    `STATE  ${st.state}`,
    `TEMP   ${st.temp.toFixed(1)} / ${st.target} C`,
    `TIME   ${st.hr.toFixed(1)} / ${st.time} h`,
    `AGIT   ${st.rps.toFixed(2)} rps`,
    `LEVEL  ${Math.round(st.level * 100)} %`,
  ];
  lines.forEach((l, i) => c.fillText(l, 18, 80 + i * 34));
  c.strokeStyle = '#1f3a4d'; c.strokeRect(6, 6, W - 12, H - 12);
  screen.tex.needsUpdate = true;
}

function buildCrane(scene) {
  const { railY, z1, z2, x1, x2 } = CRANE;
  const g = new THREE.Group(); g.name = 'crane';
  for (const z of [z1, z2]) {
    place(g, mesh(boxGeo(x2 - x1, 0.2, 0.18), M.beam, { cast: true }), (x1 + x2) / 2, railY, z);
    place(g, mesh(cylGeo(0.09, 0.09, railY, 12), M.beam), x2, railY / 2, z);
  }
  const bridge = new THREE.Group();
  place(bridge, mesh(boxGeo(0.34, 0.34, z2 - z1 + 0.4), M.safety, { cast: true }), 0, railY + 0.27, (z1 + z2) / 2);
  for (const z of [z1, z2]) place(bridge, mesh(boxGeo(0.6, 0.2, 0.3), M.safety), 0, railY + 0.15, z);
  const trolley = new THREE.Group();
  place(trolley, mesh(boxGeo(0.62, 0.26, 0.5), M.safety, { cast: true }), 0, railY + 0.02, 0);
  place(trolley, mesh(cylGeo(0.12, 0.12, 0.4, 16), M.darkSteel).rotateZ(Math.PI / 2), 0, railY - 0.16, 0);
  const cable = mesh(cylGeo(0.012, 0.012, 1, 6), M.darkSteel); trolley.add(cable);
  const hook = new THREE.Group();
  place(hook, mesh(boxGeo(0.22, 0.18, 0.16), M.safety), 0, 0.09, 0);
  place(hook, mesh(new THREE.TorusGeometry(0.06, 0.015, 6, 12, Math.PI * 1.5), M.darkSteel), 0, -0.04, 0);
  trolley.add(hook);
  bridge.add(trolley);
  g.add(bridge);
  scene.add(g); registerEquip(g, 'crane');
  const lbl = makeLabel('<b>천장 크레인</b><br><span class="sub">톤백 운반</span>'); lbl.position.set(-12, railY + 0.4, z1 + 0.6); g.add(lbl);
  return { group: g, bridge, trolley, cable, hook, carried: null };
}
function setCrane(crane, x, z, hookY) {
  crane.bridge.position.x = x;
  crane.trolley.position.z = z;
  const top = CRANE.railY - 0.3;
  const len = Math.max(0.05, top - (hookY + 0.18));
  crane.cable.scale.y = len;
  crane.cable.position.set(0, hookY + 0.18 + len / 2, 0);
  crane.hook.position.set(0, hookY, 0);
}

function buildConveyor(scene) {
  const { start: S, end: E, width } = CONVEYOR;
  const dir = E.clone().sub(S); const len = dir.length(); dir.normalize();
  const angle = Math.atan2(dir.y, dir.x);
  const g = new THREE.Group(); g.name = 'conveyor';
  const belt = new THREE.Group(); belt.position.copy(S); belt.rotation.z = angle; g.add(belt);

  const beltTex = canvasTexture(128, 32, (c, W, H) => {
    c.fillStyle = '#1e2124'; c.fillRect(0, 0, W, H);
    c.strokeStyle = '#3a3f45'; c.lineWidth = 4;
    for (let x = 8; x < W; x += 32) { c.beginPath(); c.moveTo(x, 4); c.lineTo(x + 10, H / 2); c.lineTo(x, H - 4); c.stroke(); }
  }).tex;
  beltTex.wrapS = THREE.RepeatWrapping; beltTex.repeat.set(len / 0.5, 1);
  const beltMat = new THREE.MeshStandardMaterial({ map: beltTex, roughness: 0.9 });
  place(belt, mesh(boxGeo(len, 0.06, width), beltMat, { cast: true }), len / 2, 0, 0);
  for (const z of [-1, 1]) place(belt, mesh(boxGeo(len, 0.16, 0.05), M.darkSteel, { cast: true }), len / 2, 0.02, z * (width / 2 + 0.04));
  const rollers = [];
  const rollerGeo = cylGeo(0.06, 0.06, width + 0.04, 14);
  for (let s = 0.2; s < len; s += 0.45) {
    const r = mesh(rollerGeo, M.steel); r.rotation.x = Math.PI / 2; place(belt, r, s, -0.07, 0); rollers.push(r);
  }
  // 지지 다리 (월드 수직)
  for (const frac of [0.08, 0.45, 0.82]) {
    const p = S.clone().addScaledVector(dir, len * frac);
    for (const z of [-0.32, 0.32]) {
      const legH = p.y - 0.1;
      place(g, mesh(boxGeo(0.08, legH, 0.08), M.beam, { cast: true }), p.x, legH / 2, z);
    }
    place(g, mesh(boxGeo(0.08, 0.08, 0.72), M.beam), p.x, p.y - 0.1, 0);
  }
  // 반응조 투입 슈트
  const chuteDir = INLET.clone().sub(E); const chuteLen = chuteDir.length();
  const chute = mesh(boxGeo(chuteLen, 0.04, 0.45), M.steel, { cast: true });
  chute.position.copy(E).add(INLET).multiplyScalar(0.5);
  chute.rotation.z = Math.atan2(chuteDir.y, chuteDir.x); g.add(chute);

  // 투입 호퍼
  const hopper = new THREE.Group(); hopper.name = 'hopper';
  place(hopper, mesh(cylGeo(0.8, 0.25, 1.0, 28, true), M.vessel, { cast: true }), 0, 1.95, 0);
  place(hopper, mesh(new THREE.TorusGeometry(0.8, 0.03, 8, 40), M.darkSteel).rotateX(Math.PI / 2), 0, 2.45, 0);
  for (const [sx, sz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) place(hopper, mesh(boxGeo(0.07, 2.45, 0.07), M.beam), sx * 0.62, 1.225, sz * 0.62);
  hopper.position.copy(HOPPER_POS);
  const hl = makeLabel('<b>투입 호퍼</b> · 컨베이어'); hl.position.set(0, 3.0, 0); hopper.add(hl);
  scene.add(hopper); registerEquip(hopper, 'hopper');

  scene.add(g); registerEquip(g, 'conveyor');
  return { group: g, beltTex, rollers, dir, len, normal: new THREE.Vector3(-dir.y, dir.x, 0) };
}

function buildReactor(scene) {
  const { R, H, Y0, jacketR } = REACTOR;
  const g = new THREE.Group(); g.name = 'reactor';
  const closed = new THREE.Group(), cut = new THREE.Group();
  g.add(closed, cut);
  const CUT_S = Math.PI / 4, CUT_L = Math.PI * 1.5;   // 앞쪽(+Z) 90° 제거

  // 몸체 · 재킷 (닫힘 / 단면)
  place(closed, mesh(cylGeo(R, R, H, 72, true), M.vessel, { cast: true }), 0, Y0 + H / 2, 0);
  place(cut, mesh(cylGeo(R, R, H, 72, true, CUT_S, CUT_L), M.vessel, { cast: true }), 0, Y0 + H / 2, 0);
  const jH = 2.2, jY = Y0 + 0.1 + jH / 2;
  const jacketClosed = mesh(cylGeo(jacketR, jacketR, jH, 72, true), M.jacket, { cast: true });
  const jacketCut = mesh(cylGeo(jacketR, jacketR, jH, 72, true, CUT_S, CUT_L), M.jacket, { cast: true });
  place(closed, jacketClosed, 0, jY, 0); place(cut, jacketCut, 0, jY, 0);
  for (const y of [jY - jH / 2, jY + jH / 2]) {
    place(closed, mesh(new THREE.TorusGeometry(jacketR, 0.035, 8, 72), M.steel).rotateX(Math.PI / 2), 0, y, 0);
  }
  // 단면 표시면
  for (const th of [CUT_S, CUT_S + CUT_L]) {
    const sec = new THREE.Mesh(new THREE.PlaneGeometry(0.2, H), M.section);
    sec.position.set(1.66 * Math.sin(th), Y0 + H / 2, 1.66 * Math.cos(th));
    sec.rotation.y = th - Math.PI / 2; cut.add(sec);
  }
  // 투시창 (닫힘 상태 전용)
  const sg = new THREE.Group();
  place(sg, mesh(new THREE.TorusGeometry(0.24, 0.04, 8, 24), M.steel), 0, 0, 0);
  place(sg, new THREE.Mesh(new THREE.CircleGeometry(0.22, 24), M.glass), 0, 0, 0.005);
  sg.position.set((R + 0.01) * Math.sin(0.25), Y0 + 2.75, (R + 0.01) * Math.cos(0.25)); sg.rotation.y = 0.25;
  closed.add(sg);

  // 접시형 바닥 · 뚜껑
  const dish = mesh(new THREE.SphereGeometry(R, 56, 14, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), M.vessel, { cast: true });
  dish.scale.y = 0.28; place(g, dish, 0, Y0, 0);
  const lidFull = mesh(new THREE.SphereGeometry(R, 56, 14, 0, Math.PI * 2, 0, Math.PI / 2), M.vessel, { cast: true });
  lidFull.scale.y = 0.25; place(closed, lidFull, 0, Y0 + H, 0);
  const lidCut = mesh(new THREE.SphereGeometry(R, 56, 14, Math.PI * 0.75, Math.PI * 1.5, 0, Math.PI / 2), M.vessel, { cast: true });
  lidCut.scale.y = 0.25; place(cut, lidCut, 0, Y0 + H, 0);
  place(closed, mesh(new THREE.TorusGeometry(R, 0.05, 8, 72), M.steel).rotateX(Math.PI / 2), 0, Y0 + H, 0);
  // 뚜껑 노즐
  place(g, mesh(cylGeo(0.16, 0.16, 0.25, 16), M.steel), INLET.x, INLET.y, INLET.z);
  // 바닥 배출 노즐
  place(g, mesh(cylGeo(0.1, 0.1, 0.3, 12), M.steel), 0, Y0 - R * 0.28 - 0.1, 0);
  // 다리 · 베이스
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    place(g, mesh(cylGeo(0.09, 0.09, Y0 + 0.4, 12), M.darkSteel, { cast: true }), 1.35 * Math.sin(a), (Y0 + 0.4) / 2, 1.35 * Math.cos(a));
    place(g, mesh(boxGeo(0.35, 0.05, 0.35), M.concrete), 1.35 * Math.sin(a), 0.025, 1.35 * Math.cos(a));
  }

  // 침출액 + 표면 (와류)
  const liquid = mesh(cylGeo(1.56, 1.56, 1, 56), M.liquid);
  g.add(liquid);
  const surfGeo = new THREE.RingGeometry(0.02, 1.56, 64, 7);
  const surfBase = surfGeo.attributes.position.array.slice();
  const surface = new THREE.Mesh(surfGeo, M.liquid); surface.rotation.x = -Math.PI / 2; g.add(surface);

  // 교반기: 모터(고정) + 축 · 피치드 블레이드 터빈 2단(회전)
  const motorY = Y0 + H + 0.4;
  place(g, mesh(boxGeo(0.5, 0.18, 0.5), M.darkSteel, { cast: true }), 0, motorY + 0.09, 0);
  place(g, mesh(cylGeo(0.26, 0.26, 0.5, 24), M.motor, { cast: true }), 0, motorY + 0.43, 0);
  place(g, mesh(cylGeo(0.2, 0.2, 0.12, 24), M.darkSteel), 0, motorY + 0.74, 0);
  const rotor = new THREE.Group(); g.add(rotor);
  place(rotor, mesh(cylGeo(0.055, 0.055, motorY - 1.05, 12), M.steel), 0, (motorY + 1.05) / 2, 0);
  const bladeGeo = boxGeo(0.5, 0.035, 0.17);
  for (const hy of [Y0 + 0.45, Y0 + 1.55]) {
    place(rotor, mesh(cylGeo(0.1, 0.1, 0.12, 16), M.steel), 0, hy, 0);
    for (let k = 0; k < 4; k++) {
      const holder = new THREE.Group(); holder.rotation.y = k * Math.PI / 2; holder.position.y = hy;
      const blade = mesh(bladeGeo, M.steel); blade.position.x = 0.33; blade.rotation.x = Math.PI / 4;
      holder.add(blade); rotor.add(holder);
    }
  }

  // 온도 게이지 (θ = 60°, 바깥을 향함)
  const gauge = new THREE.Group();
  const dialTex = canvasTexture(256, 256, (c, W, Hh) => {
    const cx = W / 2, cy = Hh / 2, r = 108;
    c.fillStyle = '#f8f9fa'; c.beginPath(); c.arc(cx, cy, 124, 0, Math.PI * 2); c.fill();
    const toRad = (deg) => (deg - 90) * Math.PI / 180;
    c.lineWidth = 14; c.strokeStyle = '#e03131';
    c.beginPath(); c.arc(cx, cy, r - 8, toRad(gaugeDeg(95)), toRad(gaugeDeg(100))); c.stroke();
    c.strokeStyle = '#212529'; c.fillStyle = '#212529'; c.font = 'bold 20px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    for (let t = 40; t <= 100; t += 5) {
      const a = toRad(gaugeDeg(t)), major = t % 10 === 0;
      c.lineWidth = major ? 4 : 2;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * (r - (major ? 20 : 12)), cy + Math.sin(a) * (r - (major ? 20 : 12)));
      c.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); c.stroke();
      if (major) c.fillText(String(t), cx + Math.cos(a) * (r - 38), cy + Math.sin(a) * (r - 38));
    }
    c.font = 'bold 22px sans-serif'; c.fillText('℃', cx, cy + 46);
    c.font = '13px sans-serif'; c.fillStyle = '#e03131'; c.fillText('95 한계', cx + 62, cy + 84);
  }).tex;
  place(gauge, mesh(cylGeo(0.42, 0.42, 0.08, 40), M.darkSteel).rotateX(Math.PI / 2), 0, 0, 0);
  place(gauge, new THREE.Mesh(new THREE.CircleGeometry(0.38, 40), new THREE.MeshStandardMaterial({ map: dialTex, roughness: 0.4 })), 0, 0, 0.042);
  const needleGeo = boxGeo(0.022, 0.3, 0.01); needleGeo.translate(0, 0.12, 0);
  const needle = mesh(needleGeo, new THREE.MeshStandardMaterial({ color: 0xc92a2a, emissive: 0x5c0000, emissiveIntensity: 0.6 }));
  needle.position.z = 0.055; gauge.add(needle);
  place(gauge, mesh(cylGeo(0.035, 0.035, 0.03, 12), M.darkSteel).rotateX(Math.PI / 2), 0, 0, 0.06);
  place(gauge, mesh(boxGeo(0.08, 0.08, 0.2), M.darkSteel), 0, 0, -0.12);
  const gTh = Math.PI / 3;
  gauge.position.set(1.9 * Math.sin(gTh), Y0 + 1.8, 1.9 * Math.cos(gTh)); gauge.rotation.y = gTh;
  g.add(gauge);
  const gaugeLbl = makeLabel('', 'live key'); gaugeLbl.position.set(0, 0.62, 0); gauge.add(gaugeLbl);

  // 액위계 (θ = 100°)
  const lTh = Math.PI * 100 / 180;
  const level = new THREE.Group();
  place(level, new THREE.Mesh(cylGeo(0.06, 0.06, 3.0, 12), M.acrylic), 0, 1.5, 0);
  const levelBar = mesh(cylGeo(0.035, 0.035, 1, 10), new THREE.MeshStandardMaterial({ color: COLORS.liquidHigh, emissive: COLORS.liquidHigh, emissiveIntensity: 0.4 }));
  level.add(levelBar);
  for (const y of [0, 3.0]) place(level, mesh(boxGeo(0.14, 0.06, 0.14), M.darkSteel), 0, y, 0);
  level.position.set(1.85 * Math.sin(lTh), Y0 + 0.2, 1.85 * Math.cos(lTh));
  g.add(level);

  // 운전 플랫폼 (y = 3.2) · 난간 · 계단
  const deckY = 3.2;
  const shape = new THREE.Shape(); shape.absarc(0, 0, 2.6, 0, Math.PI * 2, false);
  const hole = new THREE.Path(); hole.absarc(0, 0, 1.8, 0, Math.PI * 2, true); shape.holes.push(hole);
  const deck = mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.08, bevelEnabled: false, curveSegments: 48 }), new THREE.MeshStandardMaterial({ color: 0x5b636c, roughness: 0.7, metalness: 0.6 }), { cast: true });
  deck.rotation.x = -Math.PI / 2; deck.position.y = deckY; g.add(deck);
  for (const ry of [deckY + 1.1, deckY + 0.55]) place(g, mesh(new THREE.TorusGeometry(2.55, 0.025, 6, 72), M.safety).rotateX(Math.PI / 2), 0, ry, 0);
  for (let i = 0; i < 16; i++) {
    const a = i * Math.PI / 8;
    place(g, mesh(cylGeo(0.022, 0.022, 1.1, 6), M.safety), 2.55 * Math.sin(a), deckY + 0.55, 2.55 * Math.cos(a));
  }
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    place(g, mesh(cylGeo(0.07, 0.07, deckY, 10), M.beam, { cast: true }), 2.45 * Math.sin(a), deckY / 2, 2.45 * Math.cos(a));
  }
  // 계단 (−Z 쪽, +X 방향으로 내려감)
  const stairs = new THREE.Group();
  place(stairs, mesh(boxGeo(0.9, 0.08, 0.9), deck.material), 2.1, deckY + 0.04, -2.0);
  const steps = 14, rise = deckY / steps, run = 0.16;
  for (let i = 0; i < steps; i++) place(stairs, mesh(boxGeo(run + 0.02, 0.04, 0.8), deck.material), 2.6 + i * run, deckY - (i + 1) * rise + 0.02, -2.0);
  const stringerLen = Math.hypot(steps * run, deckY);
  for (const z of [-2.42, -1.58]) {
    const s = mesh(boxGeo(stringerLen, 0.18, 0.04), M.beam);
    s.position.set(2.6 + steps * run / 2, deckY / 2, z); s.rotation.z = -Math.atan2(deckY, steps * run); stairs.add(s);
    const rail = mesh(cylGeo(0.02, 0.02, stringerLen, 6), M.safety);
    rail.position.set(2.6 + steps * run / 2, deckY / 2 + 0.95, z); rail.rotation.z = Math.PI / 2 - Math.atan2(deckY, steps * run); stairs.add(rail);
  }
  g.add(stairs);

  // 상태 경광등
  const bA = Math.PI / 4;
  const bx = 2.55 * Math.sin(bA), bz = 2.55 * Math.cos(bA);
  place(g, mesh(cylGeo(0.03, 0.03, 0.55, 8), M.darkSteel), bx, deckY + 1.1 + 0.27, bz);
  const beacon = mesh(new THREE.SphereGeometry(0.13, 20, 14), M.beacon);
  place(g, beacon, bx, deckY + 1.1 + 0.62, bz);

  // 기포 (InstancedMesh)

/** 결정 더미 InstancedMesh: 아래부터 쌓이도록 높이 순 정렬 */
function makeHeap(parent, cx, cz, height, mat, label, labelDz = 0) {
  const N = Math.max(60, Math.round(650 * Math.pow(height / 0.6, 2)));
  const baseR = 0.25 + height * 1.1;
  const geo = new THREE.OctahedronGeometry(0.045, 0);
  const im = new THREE.InstancedMesh(geo, mat, N);
  im.castShadow = true; im.receiveShadow = true;
  const items = [];
  for (let i = 0; i < N; i++) {
    const y = height * (1 - Math.cbrt(rng()));
    const rmax = baseR * (1 - y / height);
    const r = rmax * Math.sqrt(rng()), a = rng() * Math.PI * 2;
    items.push({ x: cx + r * Math.cos(a), y: 0.16 + y, z: cz + r * Math.sin(a), s: 0.7 + rng() * 0.7, rx: rng() * 3, ry: rng() * 3 });
  }
  items.sort((p, q) => p.y - q.y);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), s = new THREE.Vector3(), p = new THREE.Vector3();
  items.forEach((it, i) => { e.set(it.rx, it.ry, 0); q.setFromEuler(e); s.setScalar(it.s); p.set(it.x, it.y, it.z); m4.compose(p, q, s); im.setMatrixAt(i, m4); });
  im.count = 0;
  parent.add(im);
  const lbl = makeLabel(label, 'live'); lbl.position.set(cx, 0.16 + Math.max(height, 0.3) + 0.55, cz + labelDz); parent.add(lbl);
  return { im, N, label: lbl };
}

const steamTex = canvasTexture(64, 64, (c, W, H) => {
  const grd = c.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(1, 'rgba(255,255,255,0)');

class ParticleSystem {
  constructor(scene, { max = 160, size = 0.5, origin, spread = 0.15, rise = 0.6, life = 3.0, drift = new THREE.Vector3(0.25, 0, 0.1) }) {
    this.max = max; this.origin = origin; this.spread = spread; this.rise = rise; this.life = life; this.drift = drift;
    this.pos = new Float32Array(max * 3); this.col = new Float32Array(max * 4);
    this.vel = new Float32Array(max * 3); this.age = new Float32Array(max).fill(-1);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 4));
    this.points = new THREE.Points(geo, new THREE.PointsMaterial({ size, map: steamTex, vertexColors: true, transparent: true, depthWrite: false, sizeAttenuation: true }));
    this.points.frustumCulled = false;
    scene.add(this.points);
    this.acc = 0;
  }
  update(dt, rate) {
    this.acc += rate * dt;
    for (let i = 0; i < this.max && this.acc >= 1; i++) {
      if (this.age[i] >= 0) continue;
      this.acc -= 1; this.age[i] = 0;
      this.pos[i * 3] = this.origin.x + (rng() - 0.5) * this.spread;
      this.pos[i * 3 + 1] = this.origin.y;
      this.pos[i * 3 + 2] = this.origin.z + (rng() - 0.5) * this.spread;
      this.vel[i * 3] = this.drift.x * (0.5 + rng()); this.vel[i * 3 + 1] = this.rise * (0.7 + rng() * 0.6); this.vel[i * 3 + 2] = this.drift.z * (rng() - 0.3);
    }
    if (this.acc > 1) this.acc = 1;
    for (let i = 0; i < this.max; i++) {
      if (this.age[i] < 0) { this.col[i * 4 + 3] = 0; continue; }
      this.age[i] += dt;
      const k = this.age[i] / this.life;
      if (k >= 1) { this.age[i] = -1; this.col[i * 4 + 3] = 0; continue; }
      for (let a = 0; a < 3; a++) this.pos[i * 3 + a] += this.vel[i * 3 + a] * dt;
      this.col[i * 4] = this.col[i * 4 + 1] = this.col[i * 4 + 2] = 0.92;
      this.col[i * 4 + 3] = 0.55 * Math.sin(Math.PI * k) * (1 - k * 0.4);
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
  }
}

/** 원료 덩어리 · 케이크 조각 풀 */

  return items;
}

// 9. 공정 사이클 (명세 8.1)
// =====================================================================
const NEXT = { FEEDING: 'HEATING', HEATING: 'LEACHING', LEACHING: 'DISCHARGE', DISCHARGE: 'FEEDING' };
class ProcessCycle {
  constructor(onEnter) { this.onEnter = onEnter; this.state = 'IDLE'; this.t = 0; this.speed = 1; this.paused = false; this.params = null; this.cycles = 0; }
  start(params) { this.params = params; this.cycles = 0; this.enter('FEEDING'); }
  reset() { this.state = 'IDLE'; this.t = 0; }
  setSpeed(k) { this.speed = k; }
  durations() { const p = this.params; return { FEEDING: FEED_SEC, HEATING: p.heatSec, LEACHING: p.leachSec, DISCHARGE: DISCHARGE_SEC }; }
  enter(s) { this.state = s; this.t = 0; this.onEnter?.(s, this); }
  get progress() { return this.state === 'IDLE' ? 0 : Math.min(1, this.t / this.durations()[this.state]); }
  /** 공정 시간(hr): 가열 + 침출 경과 */
  get processHr() {
    const p = this.params;
    if (this.state === 'HEATING') return this.t / SEC_PER_HR;
    if (this.state === 'LEACHING') return (p.heatSec + this.t) / SEC_PER_HR;
    if (this.state === 'DISCHARGE') return p.time;
    return 0;
  }
  update(dt) {
    if (this.paused || this.state === 'IDLE') return 0;
    const d = dt * this.speed;
    this.t += d;
    if (this.t >= this.durations()[this.state]) {
      if (this.state === 'DISCHARGE') this.cycles++;
      this.enter(NEXT[this.state]);
    }
    return d;
  }
}

/** 사이클 → 공정 물리량 */
function plantState(cy) {
  const p = cy.params, s = cy.state, k = cy.progress;
  const out = { temp: AMBIENT_C, liquidH: 0.1, colorT: 0, colorFrom: COLORS.acid, colorTo: COLORS.acid, rps: 0, acidFlow: false, slurryFlow: false, filtrateFlow: false };
  if (!p) return out;
  const cool = p.temp - 15;
  switch (s) {
    case 'FEEDING':
      out.temp = cy.cycles > 0 ? THREE.MathUtils.lerp(cool, AMBIENT_C, Math.min(1, k * 1.5)) : AMBIENT_C;
      out.liquidH = 0.1 + (p.liquidH - 0.1) * easeInOut(k);
      out.colorFrom = COLORS.acid; out.colorTo = COLORS.slurry; out.colorT = clamp01((k - 0.55) / 0.45);
      out.rps = k > 0.3 ? 0.35 : 0; out.acidFlow = k < 0.85;
      break;
    case 'HEATING':
      out.temp = AMBIENT_C + (p.temp - AMBIENT_C) * easeOutCubic(k);
      out.liquidH = p.liquidH; out.colorFrom = COLORS.slurry; out.colorTo = COLORS.slurry; out.rps = p.rps;
      break;
    case 'LEACHING':
      out.temp = p.temp + 0.25 * Math.sin(cy.t * 1.3);
      out.liquidH = p.liquidH; out.rps = p.rps;
      if (k < 0.3) { out.colorFrom = COLORS.slurry; out.colorTo = COLORS.liquidLow; out.colorT = k / 0.3; }
      else { out.colorFrom = COLORS.liquidLow; out.colorTo = COLORS.liquidHigh; out.colorT = (k - 0.3) / 0.7; }
      break;
    case 'DISCHARGE':
      out.temp = p.temp - 15 * k;
      out.liquidH = p.liquidH - (p.liquidH - 0.1) * clamp01(k / 0.6);
      out.colorFrom = COLORS.liquidHigh; out.colorTo = COLORS.liquidHigh; out.rps = 0.35;
      out.slurryFlow = k < 0.6; out.filtrateFlow = k < 0.7;
      break;
  }
  out.nTnow = clamp01((out.temp - 40) / 55);
  return out;
}

function intervalBar(stat, target) {
  const lo = 80, hi = 100, pct = (v) => clamp01((v - lo) / (hi - lo)) * 100;
  return `<div class="ibar"><div class="band" style="left:${pct(stat.low)}%;width:${pct(stat.high) - pct(stat.low)}%"></div>
    <div class="tgt" style="left:${pct(target)}%"></div><div class="mean" style="left:calc(${pct(stat.mean)}% - 1px)"></div></div>
    <div class="ibar-scale"><span>80</span><span>목표 ${target}%</span><span>100</span></div>`;
}

function main() {
  // 데이터
  let vm;
  try {
    // 통합: Streamlit 데모가 Module 3 결과를 window.__TWIN_INPUT__ 으로 넘기면 그것을 읽는다
    const sc = parseInput(window.__TWIN_INPUT__ ?? DEMO_INPUT);
    const { errors, warnings } = validateRecipe(sc.recipe);
    if (errors.length) { showFatal('입력값 오류: ' + errors.join(' / ')); return; }
    vm = toViewModel(sc, warnings);
  } catch (e) { showFatal('입력값 오류: ' + e.message); return; }
  renderBanner(vm);
  renderCard(vm);

  // 장면
  const R3 = createRenderer(viewport);
  const { renderer, scene, camera, labelRenderer, controls, composer, sun } = R3;
  const shell = buildShell(scene);
  const raw = buildRawMaterialZone(scene, vm);
  const crane = buildCrane(scene);
  const conv = buildConveyor(scene);
  const reactor = buildReactor(scene);
  const tanks = buildTanksAndPipes(scene);
  const rec = buildRecoveryZone(scene);

  let params = mapRecipe(vm);
  const heapGroup = new THREE.Group(); scene.add(heapGroup);
  let heaps = null;
  function buildHeaps() {
    heapGroup.clear();
    heaps = {
      ni: makeHeap(heapGroup, 9.6, 6.3, params.niHeapH, M.niCrystal, `<b>NiSO₄·6H₂O</b> <span class="badge derived">예측 기반</span><br>Ni ${vm.recoveredKg ? f1(vm.recoveredKg.ni) : '-'} kg`, -0.45),
      co: makeHeap(heapGroup, 11.4, 6.3, params.coHeapH, M.coCrystal, `<b>CoSO₄·7H₂O</b> <span class="badge derived">예측 기반</span><br>Co ${vm.recoveredKg ? f1(vm.recoveredKg.co) : '-'} kg`, 0.55),
    };
  }
  buildHeaps();

  // 운반 톤백 · 원료 덩어리 · 케이크 조각
  const carried = makeTonbag(vm.grade); carried.visible = false; scene.add(carried);
  const staged = vm.grade ? slotPosition(vm.grade, PILE_COUNT[vm.grade]) : new THREE.Vector3(-10.5, 0, 0);
  const chunks = makePool(scene, 10, new THREE.DodecahedronGeometry(0.11, 0), M.powder);
  const cakes = makePool(scene, 28, boxGeo(0.2, 0.05, 0.2), M.cake);
  const steam = new ParticleSystem(scene, { origin: tanks.stackTop, max: 160, size: 0.6, rise: 0.7, life: 3.2 });

  // 사이클
  let chunkSpawned = 0, cakeSpawnedFor = new Set();
  const cycle = new ProcessCycle((s) => {
    if (s === 'FEEDING') chunkSpawned = 0;
    // 결정 더미 · 케이크는 다음 배출이 시작될 때 비운다 (한 사이클 내내 결과가 보이게)
    if (s === 'DISCHARGE') {
      heaps.ni.im.count = 0; heaps.co.im.count = 0;
      for (const c of cakes) { c.active = false; c.m.visible = false; }
      cakeSpawnedFor = new Set();
    }
  });
  cycle.start(params);

  // 카메라
  let camAnim = null;
  function setCameraPreset(name, instant = false) {
    const pr = CAMERA_PRESETS[name]; if (!pr) return;
    const to = { pos: new THREE.Vector3(...pr.pos), target: new THREE.Vector3(...pr.target) };
    if (instant) { camera.position.copy(to.pos); controls.target.copy(to.target); controls.update(); camAnim = null; }
    else camAnim = { from: { pos: camera.position.clone(), target: controls.target.clone() }, to, t: 0 };
    document.querySelectorAll('#camBtns button').forEach((b) => b.classList.toggle('on', b.dataset.cam === name));
  }
  setCameraPreset(OPT.cam, true);
  document.querySelectorAll('#camBtns button').forEach((b) => b.addEventListener('click', () => setCameraPreset(b.dataset.cam)));

  // 단면 · 라벨
  function setCutaway(on) { reactor.cut.visible = on; reactor.closed.visible = !on; document.getElementById('btnCut').classList.toggle('on', on); }
  let cutOn = OPT.cut; setCutaway(cutOn);
  document.getElementById('btnCut').addEventListener('click', () => { cutOn = !cutOn; setCutaway(cutOn); });
  let labelsOn = OPT.labels;
  const applyLabels = () => { labelRenderer.domElement.style.display = labelsOn ? '' : 'none'; document.getElementById('btnLabels').classList.toggle('on', labelsOn); };
  applyLabels();
  document.getElementById('btnLabels').addEventListener('click', () => { labelsOn = !labelsOn; applyLabels(); });

  // 재생 제어
  const btnPause = document.getElementById('btnPause');
  btnPause.addEventListener('click', () => { cycle.paused = !cycle.paused; btnPause.textContent = cycle.paused ? '▶ 재생' : '⏸ 일시정지'; });
  for (const k of [1, 4]) document.getElementById('btnSpeed' + k).addEventListener('click', () => {
    cycle.setSpeed(k); document.getElementById('btnSpeed1').classList.toggle('on', k === 1); document.getElementById('btnSpeed4').classList.toggle('on', k === 4);
  });

  // 설비 클릭
  let selected = null, selBox = null;
  const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', (ev) => { downAt = [ev.clientX, ev.clientY]; });
  renderer.domElement.addEventListener('pointerup', (ev) => {
    if (!downAt || Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 5) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects([...EQUIP.values()], true);
    let id = null;
    for (const h of hits) { let o = h.object; while (o && !o.userData.equip) o = o.parent; if (o && o.visible !== false) { id = o.userData.equip; break; } }
    selectEquip(id);
  });
  function selectEquip(id) {
    selected = id;
    if (selBox) { scene.remove(selBox); selBox.geometry.dispose(); selBox = null; }
    if (id) {
      const box = new THREE.Box3().setFromObject(EQUIP.get(id));
      selBox = new THREE.Box3Helper(box.expandByScalar(0.08), COLORS.safety);
      scene.add(selBox);
    }
    renderEquipmentInfo(id, vm, cycle, lastState);
    if (id) document.getElementById('equipCard').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // 개발용 슬라이더 (?debug=1, 명세 8.2)
  if (OPT.debug) {
    const dp = document.getElementById('debugPanel'); dp.hidden = false;
    const cur = { acid_l: vm.recipe.acid_l, temp_c: vm.recipe.temp_c, time_hr: vm.recipe.time_hr };
    dp.innerHTML = `<h4>개발용 — 애니메이션 확인</h4><p>애니메이션 입력만 바꾼다. 카드 · 예측값은 그대로다 (예측값 아님).</p>
      <label>황산<input type="range" id="dAcid" min="400" max="1500" step="10" value="${cur.acid_l}"><output id="oAcid">${cur.acid_l} L</output></label>
      <label>온도<input type="range" id="dTemp" min="40" max="95" step="1" value="${cur.temp_c}"><output id="oTemp">${cur.temp_c} ℃</output></label>
      <label>시간<input type="range" id="dTime" min="1" max="8" step="0.5" value="${cur.time_hr}"><output id="oTime">${cur.time_hr} hr</output></label>`;
    const onChange = () => {
      cur.acid_l = +document.getElementById('dAcid').value; cur.temp_c = +document.getElementById('dTemp').value; cur.time_hr = +document.getElementById('dTime').value;
      document.getElementById('oAcid').textContent = cur.acid_l + ' L'; document.getElementById('oTemp').textContent = cur.temp_c + ' ℃'; document.getElementById('oTime').textContent = cur.time_hr + ' hr';
      params = mapRecipe(vm, cur); cycle.start(params);
    };
    dp.querySelectorAll('input').forEach((i) => i.addEventListener('input', onChange));
    window.__mapRecipe = (o) => mapRecipe(vm, o);   // 콘솔 확인용 (명세 11.1)
  }

  // 크기
  function resize() {
    const w = viewport.clientWidth, h = viewport.clientHeight;
    camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
    renderer.setSize(w, h); labelRenderer.setSize(w, h); composer.setSize(w, h);
  }
  new ResizeObserver(resize).observe(viewport); resize();

  // ---------- 프레임 갱신 ----------
  const liquidColor = new THREE.Color(), cA = new THREE.Color(), cB = new THREE.Color();
  let lastState = plantState(cycle);
  let clockT = 0;

  function craneTrack(t) {
    // 투입 단계 시간표 (FEED_SEC = 8 s 기준)
    const park = { x: HOPPER_POS.x, z: HOPPER_POS.z };
    const pick = { x: staged.x, z: staged.z };
    const up = CRANE.hookUp, downPick = staged.y + 1.0, downDrop = 3.65;
    const L = (a, b, k) => a + (b - a) * easeInOut(clamp01(k));
    let x, z, y, bag = 'staged', bagScale = 1;
    if (t < 1.6) { x = L(park.x, pick.x, t / 1.6); z = L(park.z, pick.z, t / 1.6); y = up; }
    else if (t < 2.4) { x = pick.x; z = pick.z; y = L(up, downPick, (t - 1.6) / 0.8); }
    else if (t < 3.0) { x = pick.x; z = pick.z; y = L(downPick, up, (t - 2.4) / 0.6); bag = 'hook'; }
    else if (t < 4.6) { x = L(pick.x, park.x, (t - 3.0) / 1.6); z = L(pick.z, park.z, (t - 3.0) / 1.6); y = up; bag = 'hook'; }
    else if (t < 5.0) { x = park.x; z = park.z; y = L(up, downDrop, (t - 4.6) / 0.4); bag = 'hook'; }
    else if (t < 6.8) { x = park.x; z = park.z; y = downDrop; bag = 'hook'; bagScale = 1 - 0.7 * (t - 5.0) / 1.8; }
    else { x = park.x; z = park.z; y = L(downDrop, up, (t - 6.8) / 1.2); bag = 'none'; }
    return { x, z, y, bag, bagScale };
  }

  function stepSim(dt) {
    const d = cycle.update(dt);
    const st = plantState(cycle);
    const sdt = cycle.paused ? 0 : dt * cycle.speed;   // 시뮬레이션 시간
    clockT += sdt;

    // 크레인 · 톤백
    if (cycle.state === 'FEEDING') {
      const c = craneTrack(cycle.t);
      setCrane(crane, c.x, c.z, c.y);
      if (c.bag === 'staged') { carried.visible = true; carried.position.copy(staged); carried.scale.set(1, 1, 1); }
      else if (c.bag === 'hook') { carried.visible = true; carried.position.set(c.x, c.y - 1.0 + (1 - c.bagScale) * 0.2, c.z); carried.scale.set(1, c.bagScale, 1); }
      else carried.visible = false;
      // 원료 덩어리 생성 (5.0 ~ 6.8 s)
      while (cycle.t > 5.0 && chunkSpawned < 6 && cycle.t > 5.0 + chunkSpawned * 0.3) {
        const ch = chunks.find((c) => !c.active);
        if (!ch) break;
        ch.active = true; ch.s = 0; ch.phase = 0; ch.m.visible = true; chunkSpawned++;
      }
    } else {
      setCrane(crane, HOPPER_POS.x, HOPPER_POS.z, CRANE.hookUp);
      carried.visible = cycle.state !== 'IDLE' && vm.grade != null;
      carried.position.copy(staged); carried.scale.set(1, 1, 1);
    }
    for (const ch of chunks) {
      if (!ch.active) continue;
      if (ch.phase === 0) {
        ch.s += CONVEYOR.speed * sdt;
        const p = CONVEYOR.start.clone().addScaledVector(conv.dir, Math.min(ch.s, conv.len)).addScaledVector(conv.normal, 0.13);
        ch.m.position.copy(p); ch.m.rotation.x += sdt * 2;
        if (ch.s >= conv.len) { ch.phase = 1; ch.s = 0; }
      } else {
        ch.s += sdt / 0.35;
        ch.m.position.lerpVectors(CONVEYOR.end, INLET, Math.min(1, ch.s));
        if (ch.s >= 1) { ch.active = false; ch.m.visible = false; }
      }
    }

    // 컨베이어 (상시)
    conv.beltTex.offset.x -= CONVEYOR.speed * sdt / 0.5;
    for (const r of conv.rollers) r.rotation.y -= sdt * CONVEYOR.speed / 0.06;

    // 반응조
    const { Y0 } = REACTOR;
    const h = st.liquidH;
    reactor.liquid.scale.y = Math.max(0.01, h);
    reactor.liquid.position.y = Y0 + h / 2;
    reactor.surface.position.y = Y0 + h + 0.002;
    cA.setHex(st.colorFrom); cB.setHex(st.colorTo); liquidColor.copy(cA).lerp(cB, st.colorT);
    M.liquid.color.copy(liquidColor);
    reactor.rotor.rotation.y += st.rps * Math.PI * 2 * sdt;
    const pos = reactor.surfGeo.attributes.position, base = reactor.surfBase;
    const depth = 0.06 * st.rps, phase = reactor.rotor.rotation.y;
    for (let i = 0; i < pos.count; i++) {
      const x = base[i * 3], y = base[i * 3 + 1];
      const r = Math.hypot(x, y) / 1.56, a = Math.atan2(y, x);
      pos.setZ(i, -depth * (1 - r * r) + 0.025 * st.rps * r * Math.sin(3 * a - phase * 1.5) + 0.01 * Math.sin(clockT * 3 + r * 9));
    }
    pos.needsUpdate = true; reactor.surfGeo.computeVertexNormals();
    reactor.needle.rotation.z = -THREE.MathUtils.degToRad(gaugeDeg(st.temp));
    M.jacket.emissiveIntensity = (cycle.state === 'HEATING' || cycle.state === 'LEACHING') ? 0.18 * st.nTnow : 0;
    reactor.levelBar.scale.y = Math.max(0.01, h * 3.0 / REACTOR.H);
    reactor.levelBar.position.y = (h * 3.0 / REACTOR.H) / 2;

    // 기포 (가열 · 침출 중)
    const heating = cycle.state === 'HEATING' || cycle.state === 'LEACHING';
    const want = heating ? Math.round(4 + 26 * st.nTnow) : 0;
    const m4 = new THREE.Matrix4();
    let n = 0;
    for (let i = 0; i < reactor.bubbleState.length; i++) {
      const b = reactor.bubbleState[i];
      if (!b.alive && i < want) { const rr = 1.3 * Math.sqrt(rng()), aa = rng() * Math.PI * 2; Object.assign(b, { x: rr * Math.cos(aa), z: rr * Math.sin(aa), y: Y0 + 0.2 + rng() * 0.4, v: 0.5 + rng() * 0.6, alive: true }); }
      if (!b.alive) continue;
      b.y += b.v * sdt; b.x += Math.cos(phase + i) * 0.1 * sdt; b.z += Math.sin(phase + i) * 0.1 * sdt;
      if (b.y > Y0 + h - 0.03) { b.alive = false; continue; }
      m4.makeTranslation(b.x, b.y, b.z); reactor.bubbles.setMatrixAt(n++, m4);
    }
    reactor.bubbles.count = n; reactor.bubbles.instanceMatrix.needsUpdate = true;

    // 수증기 (스크러버 스택)
    steam.update(sdt, heating ? 40 * st.nTnow * st.nTnow : 2);

    // 배관 흐름
    for (const f of [tanks.acidPipe.flow, tanks.peroxidePipe.flow]) f.on = st.acidFlow;
    tanks.duct.flow.on = heating && st.nTnow > 0.2;
    rec.slurry1.flow.on = rec.slurry2.flow.on = st.slurryFlow;
    rec.filtrate.flow.on = st.filtrateFlow;
    rec.toSX.flow.on = rec.toCrystal.flow.on = cycle.state === 'DISCHARGE';
    updateFlows(sdt);

    // 필터프레스 (배출 단계)
    const pr = rec.press;
    let followerX = PRESS.closedFollowerX, openK = 0;
    if (cycle.state === 'DISCHARGE') {
      const k = cycle.progress;
      if (k < 0.25) followerX = PRESS.closedFollowerX;
      else if (k < 0.4) followerX = THREE.MathUtils.lerp(PRESS.closedFollowerX, PRESS.openFollowerX, easeInOut((k - 0.25) / 0.15));
      else if (k < 0.75) { followerX = PRESS.openFollowerX; openK = (k - 0.4) / 0.35; }
      else { followerX = THREE.MathUtils.lerp(PRESS.openFollowerX, PRESS.closedFollowerX, easeInOut((k - 0.75) / 0.25)); openK = 1 - (k - 0.75) / 0.25; }
    }
    pr.follower.position.set(followerX, PRESS.plateY, 0);
    pr.ram.scale.y = Math.max(0.05, 7.3 - followerX);
    pr.ram.position.set((followerX + 7.3) / 2, PRESS.plateY, 0);
    const NP = PRESS.plates;
    for (let i = 0; i < NP; i++) {
      const closedX = PRESS.fixedX + 0.2 + i * 0.085;
      const openX = PRESS.openFollowerX - 0.15 - (NP - 1 - i) * 0.11;
      // 뒤쪽 판부터 차례로 이동
      const order = (NP - 1 - i) / NP;
      const k = clamp01((openK - order) * NP / 2);
      pr.plates[i].position.x = THREE.MathUtils.lerp(closedX, openX, cycle.state === 'DISCHARGE' && cycle.progress >= 0.75 ? openK : k);
      if (cycle.state === 'DISCHARGE' && cycle.progress < 0.75 && k > 0.5 && !cakeSpawnedFor.has(i)) {
        cakeSpawnedFor.add(i);
        for (let j = 0; j < 2; j++) {
          const c = cakes.find((q) => !q.active); if (!c) break;
          c.active = true; c.m.visible = true; c.vy = 0;
          c.m.position.set(pr.plates[i].position.x - 0.05, PRESS.plateY - 0.3, (rng() - 0.5) * 0.6);
          c.m.rotation.set(rng(), rng(), rng());
          c.rest = 0.08 + rng() * 0.12;
        }
      }
    }
    for (const c of cakes) {
      if (!c.active || c.m.position.y <= c.rest) continue;
      c.vy -= 9.8 * sdt; c.m.position.y = Math.max(c.rest, c.m.position.y + c.vy * sdt);
    }

    // 결정 더미 (배출 후반)
    if (cycle.state === 'DISCHARGE') {
      const frac = clamp01((cycle.progress - 0.5) / 0.5);
      heaps.ni.im.count = Math.floor(heaps.ni.N * frac); heaps.co.im.count = Math.floor(heaps.co.N * frac);
    }

    // 믹서 · 경광등
    for (const s of rec.spinners) s.rotation.y += sdt * 6;
    M.beacon.emissiveIntensity = 0.6 + 1.8 * (Math.sin(clockT * Math.PI * 2) > 0 ? 1 : 0.15);

    lastState = st;
    return st;
  }

  // 초기 시점 이동 (?seek=초, 검증 · 스크린샷용)
  for (let s = 0; s < OPT.seek; s += 1 / 30) stepSim(1 / 30);
  if (OPT.pick && EQUIP.has(OPT.pick)) { scene.updateMatrixWorld(); selectEquip(OPT.pick); }

  // 성능 모드 (명세 10장)
  let perfMode = false, slowSec = 0, fpsAcc = 0, fpsN = 0;
  function enablePerfMode() {
    perfMode = true; renderer.shadowMap.enabled = false; sun.castShadow = false;
    scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; });
    document.getElementById('perfBadge').hidden = false;
  }

  // 가려진 라벨 흐리게 (설비 뒤 라벨이 앞에 겹쳐 보이지 않게)
  const labelObjs = [];
  scene.traverse((o) => { if (o.isCSS2DObject) labelObjs.push(o); });
  const occluders = [...EQUIP.values()];
  const occRay = new THREE.Raycaster(), lp = new THREE.Vector3(), ldir = new THREE.Vector3();
  const visibleChain = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
  const equipOf = (o) => { for (; o; o = o.parent) if (o.userData.equip) return o.userData.equip; return null; };
  function updateLabelOcclusion() {
    scene.updateMatrixWorld();
    for (const l of labelObjs) {
      l.getWorldPosition(lp);
      ldir.copy(lp).sub(camera.position); const dist = ldir.length(); ldir.normalize();
      occRay.set(camera.position, ldir); occRay.far = Math.max(0.1, dist - 0.3);
      const own = equipOf(l);
      const blocked = occRay.intersectObjects(occluders, true).some((h) =>
        !h.object.material?.transparent && visibleChain(h.object) && equipOf(h.object) !== own);
      l.userData.el.style.opacity = blocked ? '0.15' : '1';
    }
  }

  // 라벨 · 패널 갱신 (10 Hz)
  let uiAcc = 1, scadaAcc = 1, occAcc = 1;
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.1);
    const st = stepSim(dt);

    if (camAnim) {
      camAnim.t = Math.min(1, camAnim.t + dt / 0.9);
      const k = easeInOut(camAnim.t);
      camera.position.lerpVectors(camAnim.from.pos, camAnim.to.pos, k);
      controls.target.lerpVectors(camAnim.from.target, camAnim.to.target, k);
      if (camAnim.t >= 1) camAnim = null;
    }
    controls.update();
    shell.ceiling.visible = controls.getPolarAngle() > 0.35;   // 위에서 볼 때 천장 보 숨김

    uiAcc += dt; scadaAcc += dt; occAcc += dt;
    if (occAcc > 0.25 && labelsOn) { occAcc = 0; updateLabelOcclusion(); }
    if (uiAcc > 0.1) {
      uiAcc = 0;
      const p = cycle.params;
      reactor.label.userData.el.innerHTML = `<b>침출 반응조</b> · ${STATE_KO[cycle.state]}<br>${st.temp.toFixed(1)} ℃ · ${cycle.processHr.toFixed(1)} / ${p.time.toFixed(1)} hr`;
      reactor.gaugeLbl.userData.el.innerHTML = `<b>${st.temp.toFixed(1)} ℃</b> <span class="sub">/ ${p.temp}</span>`;
      renderProgress(cycle, st);
      if (selected) renderEquipmentInfo(selected, vm, cycle, st);
    }
    if (scadaAcc > 0.5) {
      scadaAcc = 0;
      drawScada(raw.screen, { state: cycle.state, temp: st.temp, target: cycle.params.temp, hr: cycle.processHr, time: cycle.params.time, rps: st.rps, level: st.liquidH / REACTOR.H });
    }

    if (perfMode) renderer.render(scene, camera); else composer.render();
    labelRenderer.render(scene, camera);

    if (OPT.autoperf && !perfMode) {
      fpsAcc += dt; fpsN++;
      if (fpsAcc >= 1) { const fps = fpsN / fpsAcc; slowSec = fps < 25 ? slowSec + 1 : 0; fpsAcc = 0; fpsN = 0; if (slowSec >= 3) enablePerfMode(); }
    }
  }
  frame();
  window.__twin = { cycle, vm, get params() { return params; } };
}

try { main(); }
catch (e) { console.error(e); showFatal('화면을 만드는 중 오류가 발생했습니다: ' + e.message); }
</script>
</body>

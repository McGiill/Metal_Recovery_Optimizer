# docker compose up --build
#   추천 데모 · 3D 디지털 트윈 → http://localhost:8501
#   예측 API 문서             → http://localhost:8000/docs
#
# 두 서비스가 같은 이미지를 쓴다. 빌드는 한 번만 일어난다.

services:
  app:
    build: .
    image: metal-recovery-optimizer:latest
    container_name: mro-app
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: metal-recovery-optimizer:latest
    container_name: mro-api
    depends_on:
      - app                      # 같은 이미지를 쓰므로 app 의 빌드를 기다린다
    command:
      - uvicorn
      - api.main:app
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
